<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07152f">
    <meta
      name="description"
      content="Kelajakdagi yo'lingni Shams Academy bilan boshla va koinlar bilan maqsadlaringga erish."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="Shams Academy — Koin tizimi">
    <meta
      property="og:description"
      content="Kelajakdagi yo'lingni biz bilan boshla hamda koinlar bilan maqsadlaringga erish!"
    >
    <meta
      property="og:image"
      content="https://shamsacademycoin.netlify.app/assets/shams-academy-poster.png"
    >
    <title>Shams Academy — Koin tizimi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        color-scheme: dark;
        font-family: "Manrope", "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --navy: #07152f;
        --gold: #ffc947;
        --muted: #bdc9e2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: #fff;
        background:
          radial-gradient(ellipse at 14% 14%, rgb(37 79 146 / 36%), transparent 38rem),
          radial-gradient(ellipse at 88% 85%, rgb(28 60 116 / 28%), transparent 34rem),
          var(--navy);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: clamp(1.25rem, 5vw, 4rem);
      }

      .hero {
        display: grid;
        width: min(1160px, 100%);
        grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.14fr);
        align-items: center;
        gap: clamp(2rem, 5vw, 5rem);
      }

      .intro {
        padding-block: 1.5rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: clamp(2rem, 6vw, 4.25rem);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        width: 2.35rem;
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgb(255 201 71 / 70%);
        border-radius: 50%;
        color: var(--gold);
        font-size: 1.15rem;
        box-shadow: 0 0 1.5rem rgb(255 201 71 / 18%);
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 4.65rem);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 1.08;
        text-wrap: balance;
      }

      h1 span {
        color: var(--gold);
      }

      .lead {
        max-width: 36rem;
        margin: 1.4rem 0 2rem;
        color: var(--muted);
        font-size: clamp(1rem, 1.5vw, 1.12rem);
        line-height: 1.8;
      }

      .open-bot {
        display: inline-flex;
        min-height: 3.65rem;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        padding: 0.95rem 1.7rem;
        border: 1px solid #ffe28d;
        border-radius: 999px;
        color: #211700;
        background: linear-gradient(135deg, #ffe58c, #ffc22e 58%, #f2a900);
        box-shadow: 0 0.7rem 2.1rem rgb(255 190 35 / 25%);
        font-size: 0.92rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .open-bot:hover {
        transform: translateY(-2px);
        box-shadow: 0 1rem 2.5rem rgb(255 190 35 / 35%);
      }

      .open-bot:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .arrow {
        font-size: 1.1rem;
        transition: transform 180ms ease;
      }

      .open-bot:hover .arrow {
        transform: translateX(3px);
      }

      .poster-frame {
        position: relative;
        padding: 0.55rem;
        border: 1px solid rgb(255 218 117 / 52%);
        border-radius: 1.35rem;
        background: linear-gradient(145deg, rgb(255 214 103 / 20%), rgb(255 255 255 / 3%));
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 42%), 0 0 4rem rgb(43 87 157 / 18%);
      }

      .poster-frame::before {
        position: absolute;
        z-index: -1;
        border-radius: inherit;
        background: rgb(255 194 46 / 17%);
        content: "";
        filter: blur(42px);
        inset: 12% 7%;
      }

      .poster {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.95rem;
      }

      @media (max-width: 760px) {
        main {
          padding: 1.5rem 1.15rem 2rem;
        }

        .hero {
          max-width: 34rem;
          grid-template-columns: 1fr;
          gap: 2rem;
        }

        .intro {
          padding-block: 0;
        }

        .brand {
          margin-bottom: 2rem;
        }

        h1 {
          max-width: 16ch;
          font-size: clamp(2.45rem, 10vw, 3.8rem);
        }

        .lead {
          margin-block: 1.1rem 1.5rem;
        }

        .open-bot {
          width: 100%;
        }

        .poster-frame {
          padding: 0.35rem;
          border-radius: 0.9rem;
        }

        .poster {
          border-radius: 0.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="intro">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>Shams Academy</span>
          </div>
          <h1 id="hero-title">Kelajaging sari <span>birinchi qadam.</span></h1>
          <p class="lead">
            kelajakdagi yo'lingni biz bilan boshla hamda koinlar bilan maqsadlaringizga erishing!!!
          </p>
          <a
            class="open-bot"
            href="https://t.me/Shams_coin_bot"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Shams Academy Telegram botini ochish"
          >
            OPENBOT <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
        <div class="poster-frame">
          <img
            class="poster"
            src="assets/shams-academy-poster.png"
            alt="Shams Academy koin tizimi: o'quv qurollari uchun koin mukofotlari va Haj safari sovg'asi"
            width="1280"
            height="702"
            fetchpriority="high"
          >
        </div>
      </section>
    </main>
  </body>
</html>
